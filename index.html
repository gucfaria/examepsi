<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de Exame Psíquico</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ee;--card:#fff;--ink:#1c2320;--mute:#6b736f;--line:#e0ded5;--ok:#1f5f5b;--okbg:#e2efec;--alt:#a8461f;--altbg:#f9e7dd}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
header{position:sticky;top:0;z-index:5;background:rgba(244,243,238,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
h1{font-size:16px;margin:0 10px 0 0;font-weight:600;letter-spacing:-.01em}
.lbl{font-size:12px;color:var(--mute);margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.primary:hover{filter:brightness(1.1)}
.spacer{flex:1}
main{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:20px;padding:20px;max-width:1440px;margin:0 auto}
#sections{display:flex;flex-direction:column;gap:12px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px 14px}
.sec.off .body{opacity:.35;pointer-events:none}
.sechead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sechead h2{font-size:14px;margin:0;font-weight:600;flex:1}
.num{color:var(--mute);font-weight:500;margin-right:6px;font-variant-numeric:tabular-nums}
.mini{font:inherit;font-size:12px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;color:var(--mute)}
.mini:hover{color:var(--ink);border-color:var(--ink)}
.grp{display:flex;gap:10px;padding:4px 0;align-items:flex-start}
.glabel{width:118px;flex:none;color:var(--mute);font-size:12px;padding-top:6px;line-height:1.25}
.glabel small{display:block;font-size:10.5px;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);transition:background .1s,border-color .1s}
.chip:hover{border-color:#9aa19d}
.chip.on.n{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:500}
.chip.on.a{background:var(--altbg);border-color:var(--alt);color:var(--alt);font-weight:500}
.free{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px;resize:vertical;min-height:34px;background:#fbfbf9}
.free:focus{outline:none;border-color:var(--ok);background:#fff}
aside{position:sticky;top:74px;align-self:start;display:flex;flex-direction:column;gap:10px}
.outhead{display:flex;align-items:center;gap:8px}
.outhead h2{font-size:14px;margin:0;flex:1}
#count{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
#out{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;font-family:'IBM Plex Serif',Georgia,serif;font-size:15px;line-height:1.62;white-space:pre-wrap;max-height:calc(100vh - 170px);overflow:auto;min-height:200px}
#out:empty::before{content:"Selecione as opções ao lado.";color:var(--mute)}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--mute);cursor:pointer}
.legend{font-size:12px;color:var(--mute);display:flex;gap:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%)}
#fab{display:none}
@media(max-width:960px){
 main{grid-template-columns:1fr;padding:12px}
 aside{position:static}
 #out{max-height:none}
 .grp{flex-direction:column;gap:4px}
 .glabel{width:auto;padding-top:0}
 #fab{display:block;position:fixed;right:16px;bottom:16px;z-index:10;box-shadow:0 4px 14px rgba(0,0,0,.18)}
}
</style>
</head>
<body>
<header>
  <h1>Exame psíquico</h1>
  <span><span class="lbl">Formato</span>
    <span class="seg" id="format"><button data-v="corrido" class="on">Texto corrido</button><button data-v="topicos">Por tópicos</button></span></span>
  <label class="chk"><input type="checkbox" id="titulo"> Títulos (“Exame do estado mental:”, “Exame físico:”…)</label>
  <span class="spacer"></span>
  <button class="btn" id="allNormal">Tudo normal</button>
  <button class="btn" id="clearAll">Limpar tudo</button>
</header>

<main>
  <div id="sections"></div>
  <aside>
    <div class="outhead">
      <h2>Texto gerado</h2>
      <span id="count">0 caracteres</span>
      <button class="btn primary" id="copy">Copiar</button>
    </div>
    <div id="out"></div>
    <div class="legend"><span><span class="dot" style="background:var(--ok)"></span>sem alteração</span><span><span class="dot" style="background:var(--alt)"></span>alterado</span><span>Clique de novo para desmarcar.</span></div>
  </aside>
</main>
<button class="btn primary" id="fab">Copiar texto</button>
<div id="toast"></div>

 ]},
 { id:'cons', title:'Consciência e orientação', sep:', ', groups:[

 ]},
 { id:'aten', title:'Atenção', lead:'Atenção', groups:[

   { id:'ten', label:'Tenacidade', type:'single', opts:[ o('Normotenaz','normotenaz',N), o('Hipotenaz','hipotenaz'), o('Hipertenaz','hipertenaz') ]},
   { id:'ex', label:'Achados', type:'multi', free:true, wrap:'com %s', opts:[ o('Distraibilidade','distraibilidade aumentada'), o('Falha em tarefas seriadas','dificuldade em tarefas de atenção sustentada') ]},
 ]},
 { id:'mem', title:'Memória', custom:'memoria', groups:[

 ]},
 { id:'ling', title:'Linguagem', lead:'Fala', groups:[
   { id:'fala', label:'Fala', type:'multi', opts:[ o('Sem alterações','espontânea, fluente, em volume e velocidade adequados',N), o('Logorreica','logorreica'), o('Pressão de fala','com pressão de fala'), o('Lentificada','lentificada'), o('Volume baixo','em volume baixo'), o('Monossilábica','monossilábica'), o('Latência aumentada','com latência de resposta aumentada'), o('Pobreza de conteúdo','com pobreza de conteúdo'), o('Disártrica','disártrica'), o('Disfluência','com disfluência'), o('Neologismos','com neologismos'), o('Ecolalia','com ecolalia'), o('Mutismo','ausente (mutismo)') ]},
 ]},
 { id:'humor', title:'Humor', lead:'Humor', sep:', ', groups:[
   { id:'h', label:'Humor', type:'multi', opts:[ o('Eutímico','eutímico',N), o('Deprimido','deprimido'), o('Ansioso','ansioso'), o('Irritável','irritável'), o('Disfórico','disfórico'), o('Eufórico','eufórico'), o('Expansivo','expansivo'), o('Apático','apático') ]},
   { id:'ex', label:'Achados', type:'multi', free:true, wrap:'com %s', opts:[ o('Anedonia','anedonia'), o('Angústia','angústia'), o('Tensão','tensão') ]},
 ]},
 { id:'afeto', title:'Afeto', lead:'Afeto', sep:', ', groups:[
   { id:'mod', label:'Modulação', type:'single', opts:[ o('Modulado','modulado',N), o('Hipomodulado','hipomodulado'), o('Restrito','restrito'), o('Embotado','embotado'), o('Aplanado','aplanado'), o('Lábil','lábil'), o('Hipermodulado','hipermodulado') ]},
   { id:'cong', label:'Congruência', type:'single', opts:[ o('Congruente','congruente com o humor',N), o('Incongruente','incongruente com o conteúdo do discurso') ]},

 ]},
 { id:'psmot', title:'Psicomotricidade', lead:'Psicomotricidade', groups:[

/* Exame físico — mesma mecânica de chips; sinais vitais/antropometria em campos numéricos. */

  { id:'ach', label:'Ectoscopia', type:'multi', opts:[ o('Corad@','corad@',N), o('Hidratad@','hidratad@',N), o('Anictéric@','anictéric@',N), o('Acianótic@','acianótic@',N), o('Afebril','afebril',N), o('Eupneic@','eupneic@',N),

]};
const VITAIS = [
  { id:'pa', label:'PA', un:'mmHg', ph:'120/80', txt:v=>'PA '+v+' mmHg' },
  { id:'fc', label:'FC', un:'bpm', ph:'72', txt:v=>'FC '+v+' bpm' },
  { id:'peso', label:'Peso', un:'kg', ph:'70', txt:v=>'peso '+v+' kg' },

/* ---------- utilidades de texto ---------- */
const listJoin = a => a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function sentence(s){ s = (s || '').trim(); if (!s) return ''; s = cap(s); if (!/[.!?…:]$/.test(s)) s += '.'; return s; }
const num = s => { const x = parseFloat(String(s || '').replace(',', '.')); return isFinite(x) ? x : null; };

function novoEstado(){
  const st = { fem:false, modal:'presencial', sel:{}, free:{}, off:{}, fis:{ sel:{}, v:{}, free:'', off:false }, compl:[] };
  SECTIONS.forEach(s => { st.sel[s.id] = {}; s.groups.forEach(g => st.sel[s.id][g.id] = []); st.free[s.id] = ''; st.off[s.id] = false; });
  FISICO.groups.forEach(g => st.fis.sel[g.id] = []);
  return st;
}
/* Completa um estado antigo/parcial (vindo do JSON) com as chaves que faltarem. */
function normalizar(st){
  const base = novoEstado(); st = st || {};
  const out = Object.assign(base, st);
  out.sel = Object.assign({}, base.sel); out.free = Object.assign({}, base.free, st.free || {}); out.off = Object.assign({}, base.off, st.off || {});
  SECTIONS.forEach(s => { out.sel[s.id] = {}; s.groups.forEach(g => { const a = st.sel && st.sel[s.id] && st.sel[s.id][g.id]; out.sel[s.id][g.id] = Array.isArray(a) ? a.slice() : []; }); });
  const f = st.fis || {}; out.fis = { sel:{}, v:Object.assign({}, f.v || {}), free:f.free || '', off:!!f.off };
  FISICO.groups.forEach(g => { const a = f.sel && f.sel[g.id]; out.fis.sel[g.id] = Array.isArray(a) ? a.slice() : []; });
  out.compl = Array.isArray(st.compl) ? st.compl.map(r => Object.assign({ data:'', exame:'', resultado:'', prev:false, imp:true }, r)) : [];
  return out;
}

function G(st, s){ return s.replace(/\{([^|}]*)\|([^}]*)\}/g, (m, a, b) => st.fem ? b : a).replace(/@/g, st.fem ? 'a' : 'o'); }
const chosenIn = (selArr, g) => selArr.slice().sort((a, b) => a - b).map(i => g.opts[i]).filter(Boolean);
const chosen = (st, sec, g) => chosenIn(st.sel[sec.id][g.id], g);

function groupText(sel, g){
  if (!sel.length) return '';
  const joined = listJoin(sel.map(x => x.f).filter(Boolean)); if (!joined) return '';
  const abn = sel.some(x => !x.n);
  const w = (abn && g.wrapA) ? g.wrapA : g.wrap;
  return w ? w.replace('%s', joined) : joined;
}

const CUSTOM = {
  memoria(sec, get){
    const names = { imed:'imediata', rec:'recente', rem:'remota' }, by = new Map();
    ['imed','rec','rem'].forEach(k => { const s = get(k); if (!s.length) return; const f = s[0].f; if (!by.has(f)) by.set(f, []); by.get(f).push(names[k]); });
    const plural = f => f.split(' ').map((w, i, a) => i === a.length - 1 ? w + 's' : w).join(' ');
    let t = [...by].map(([f, ns]) => ns.length > 1 ? 'memórias ' + listJoin(ns) + ' ' + plural(f) : 'memória ' + ns[0] + ' ' + f).join(', ');
    const ex = get('ex').map(x => x.f);
    if (ex.length) t = t ? t + ', com ' + listJoin(ex) : 'presença de ' + listJoin(ex);
    return sentence(t);
  },
  risco(sec, get){
    const s = get('suic'), h = get('het'), neg = [], pos = [], out = [];
    if (s.length) (s[0].n ? neg.push('suicida') : pos.push(s[0].f));
    if (h.length) (h[0].n ? neg.push('heteroagressiva') : pos.push(h[0].f));
    if (neg.length) out.push('nega ideação ' + listJoin(neg));
    if (pos.length) out.push('refere ' + listJoin(pos));
    get('ex').forEach(x => out.push(x.f));
    return out.map(sentence).join(' ');
  }
};

function freeText(t){ return String(t || '').trim().split(/\n+/).map(sentence).filter(Boolean).join(' '); }

function sectionText(st, sec){
  if (st.off[sec.id]) return '';
  let main = '';
  if (sec.custom) {
    main = CUSTOM[sec.custom](sec, gid => chosen(st, sec, sec.groups.find(g => g.id === gid)));
  } else if (sec.groups.length) {
    const parts = sec.groups.map(g => groupText(chosen(st, sec, g), g)).filter(Boolean);
    if (parts.length) main = sentence((sec.lead ? sec.lead + ' ' : '') + (sec.sep ? parts.join(sec.sep) : listJoin(parts)));
  }
  main = G(st, main);
  return [main, freeText(st.free[sec.id])].filter(Boolean).join(' ');
}

function textoModalidade(st){ return st.modal === 'tele' ? 'Avaliação realizada por teleconsulta.' : ''; }

/* fmt: 'corrido' | 'topicos' */
function textoPsiquico(st, fmt){
  const items = SECTIONS.map(s => [s, sectionText(st, s)]).filter(([, t]) => t);
  if (fmt === 'topicos') return items.map(([s, t]) => (s.short || s.title) + ': ' + t).join('\n');
  return items.map(([, t]) => t).join(' ');
}

function imc(st){
  const p = num(st.fis.v.peso); let a = num(st.fis.v.altura);
  if (!p || !a) return null; if (a > 3) a = a / 100;  // aceita cm
  return p / (a * a);
}
function textoFisico(st){
  if (st.fis.off) return '';
  const tele = st.modal === 'tele';
  const parts = [];
  if (!tele) {
    const ch = FISICO.groups.map(g => groupText(chosenIn(st.fis.sel[g.id], g), g)).filter(Boolean);
    if (ch.length) parts.push(sentence(G(st, ch.join(', '))));
  }
  const vs = VITAIS.filter(x => String(st.fis.v[x.id] || '').trim()).map(x => x.txt(String(st.fis.v[x.id]).trim()));
  const i = imc(st);
  if (vs.length) {
    let t = listJoin(vs.map((s, k) => s));
    if (i) t += ' (IMC ' + i.toFixed(1).replace('.', ',') + ' kg/m²)';
    parts.push(sentence((tele ? 'Dados referidos: ' : '') + t));
  }
  const f = freeText(st.fis.free); if (f) parts.push(f);
  if (tele && !parts.length) return '';
  return parts.join(' ');
}
/* soNovos: só linhas da consulta atual (sem 'prev'); respeita o "incluir" (imp) de cada linha. */
function textoCompl(st, soNovos){
  const rows = st.compl.filter(r => (r.exame || r.resultado) && r.imp !== false && !(soNovos && r.prev));
  if (!rows.length) return '';
  return sentence(rows.map(r => (r.exame || 'exame').trim() + (r.resultado ? ': ' + r.resultado.trim() : '') + (r.data ? ' (' + r.data.trim() + ')' : '')).join('; '));
}

/* ---------- ações sobre o estado ---------- */
function setNormalSec(st, sec){
  sec.groups.forEach(g => {
    const set = [];
    if (g.type === 'single') { const i = g.opts.findIndex(x => x.n); if (i >= 0) set.push(i); }
    else if (!g.free) g.opts.forEach((x, i) => { if (x.n) set.push(i); });
    else if (sec.id === 'risco') g.opts.forEach((x, i) => { if (x.n && i === 0) set.push(i); });
    st.sel[sec.id][g.id] = set;
  });
}
function setNormalFis(st){
  FISICO.groups.forEach(g => {
    const set = [];
    if (g.type === 'single') { const i = g.opts.findIndex(x => x.n); if (i >= 0) set.push(i); }
    else g.opts.forEach((x, i) => { if (x.n) set.push(i); });
    st.fis.sel[g.id] = set;
  });
}
/* Só o exame PSÍQUICO: o físico tem botão próprio — não registrar exame físico não realizado. */
function tudoNormal(st){ SECTIONS.forEach(s => { setNormalSec(st, s); st.off[s.id] = false; }); }
function limparTudo(st){ const n = novoEstado(); n.fem = st.fem; n.modal = st.modal; Object.keys(st).forEach(k => delete st[k]); Object.assign(st, n); }

function clickIn(arr, g, i){
  const k = arr.indexOf(i), opt = g.opts[i];
  if (k >= 0) { arr.splice(k, 1); return; }
  if (g.type === 'single') { arr.length = 0; arr.push(i); return; }
  if (!g.free) for (let j = arr.length - 1; j >= 0; j--) if (g.opts[arr[j]].n !== opt.n) arr.splice(j, 1);
  arr.push(i);
}

  const fis = EXPSI.textoFisico(st), comp = EXPSI.textoCompl(st, false);
  const blocos = [];
  if (prefs.titulo) {
    if (psi) blocos.push('Exame do estado mental:' + (prefs.format === 'topicos' ? '\n' : ' ') + psi);
    if (fis) blocos.push('Exame físico: ' + fis);
    if (comp) blocos.push('Exames complementares: ' + comp);
  } else {
    if (psi) blocos.push(psi);
    if (fis) blocos.push((prefs.format === 'topicos' ? 'Exame físico: ' : '') + fis);
    if (comp) blocos.push((prefs.format === 'topicos' ? 'Exames complementares: ' : '') + comp);
  }
  const txt = prefs.format === 'topicos' ? blocos.join('\n') : (prefs.titulo ? blocos.join('\n\n') : blocos.join(' '));
  document.getElementById('out').textContent = txt;
  document.getElementById('count').textContent = txt.length.toLocaleString('pt-BR') + ' caracteres';
}

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600); }
async function copy(){
  const txt = document.getElementById('out').textContent; if (!txt) return toast('Nada para copiar');
  try { await navigator.clipboard.writeText(txt); toast('Texto copiado'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove();
    if (ok) toast('Texto copiado');
    else { const r = document.createRange(); r.selectNodeContents(document.getElementById('out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texto selecionado — use Ctrl/Cmd+C'); }
  }
}

const fmtEl = document.getElementById('format');
fmtEl.querySelectorAll('button').forEach(b => {
  b.classList.toggle('on', b.dataset.v === prefs.format);
  b.onclick = () => { fmtEl.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); prefs.format = b.dataset.v; savePrefs(); render(); };
});
const tit = document.getElementById('titulo'); tit.checked = prefs.titulo;
tit.onchange = () => { prefs.titulo = tit.checked; savePrefs(); render(); };
document.getElementById('allNormal').onclick = () => { EXPSI.tudoNormal(st); EXPSI.repintar(); render(); };
document.getElementById('clearAll').onclick = () => { EXPSI.limparTudo(st); st.compl = []; EXPSI.repintar(); render(); };
document.getElementById('copy').onclick = copy;
document.getElementById('fab').onclick = copy;

EXPSI.tudoNormal(st);
EXPSI.montar(document.getElementById('sections'), st, render, { psiquico:true, fisico:true, compl:true, cabecalho:true });
render();
</script>
